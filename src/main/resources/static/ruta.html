<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de ruta - Servitenga</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: #fff; padding: 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); max-width: 320px;
    }
    .panel h3 { margin: 0 0 8px; }
    .panel button { margin: 4px 0; padding: 6px 10px; cursor: pointer; }
    .panel textarea { width: 100%; height: 80px; }
    .info { font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h3>Ruta de envío</h3>
    <label for="envioId" style="font-size:12px;">ID del envío:</label>
    <input type="number" id="envioId" min="1" value="1" style="width:100%;padding:6px;margin:4px 0;" />
    <button id="btnCargar" style="width:100%;">Consultar y dibujar</button>
    <div class="info" id="info"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([4.8133, -75.6961], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routeLayer = null;
    let markers = [];

    function clearMap() {
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function drawRoute(data) {
      clearMap();
      const coords = [];
      (data.pasos || []).forEach(p => {
        const g = p.geometry;
        if (g && g.coordinates) {
          g.coordinates.forEach(c => coords.push([c[1], c[0]])); // [lat, lon]
        }
      });
      if (coords.length === 0) {
        alert('No se encontraron coordenadas en la ruta.');
        return;
      }
      routeLayer = L.polyline(coords, { color: '#2563eb', weight: 4 }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

      // Marcadores de inicio y fin
      const start = coords[0];
      const end = coords[coords.length - 1];
      markers.push(L.marker(start).addTo(map).bindPopup('Origen: ' + (data.ciudadOrigen || '')));
      markers.push(L.marker(end).addTo(map).bindPopup('Destino: ' + (data.ciudadDestino || '')));

      const km = (data.distanciaMetros / 1000).toFixed(1);
      const min = (data.duracionSegundos / 60).toFixed(1);
      document.getElementById('info').innerHTML =
        '<b>Envío:</b> ' + (data.envioId || '') + '<br>' +
        '<b>Origen:</b> ' + (data.ciudadOrigen || '') + '<br>' +
        '<b>Destino:</b> ' + (data.ciudadDestino || '') + '<br>' +
        '<b>Distancia:</b> ' + km + ' km<br>' +
        '<b>Duración:</b> ' + min + ' min<br>' +
        '<b>Pasos:</b> ' + (data.pasos ? data.pasos.length : 0);
    }

    document.getElementById('btnCargar').addEventListener('click', async () => {
      const id = document.getElementById('envioId').value.trim();
      if (!id) { alert('Ingresa el ID del envío.'); return; }
      try {
        const res = await fetch('http://localhost:8080/api/envios/' + encodeURIComponent(id) + '/ruta');
        if (!res.ok) {
          let msg = 'HTTP ' + res.status;
          try { const err = await res.json(); msg = err.mensaje || msg; } catch (_) {}
          throw new Error(msg);
        }
        const data = await res.json();
        drawRoute(data);
      } catch (e) {
        alert('No se pudo cargar la ruta. Verifica que la app esté corriendo y el ID exista.\n' + e.message);
      }
    });
  </script>
</body>
</html>
