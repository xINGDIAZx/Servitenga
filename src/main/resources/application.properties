spring.application.name=servitenga
server.port=8080

# --- MySQL DataSource (usar variables de entorno, sin credenciales sensibles en el repo) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servitenga?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Observabilidad / Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
info.app.name=Servitenga API
info.app.description=API REST de seguimiento de envios con persistencia, integracion externa y observabilidad

# --- Respuestas de error en español ---
server.error.include-message=always
server.error.include-binding-errors=always
spring.web.locale=es
spring.web.locale-resolver=fixed

# --- Integracion externa (OSRM) ---
osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}